# Description: Theme based on the Entune Audio media system. The font used is the YuGothic font by JIYUKOBO. **THIS IS WHY THE FILE SIZE IS SO BIG** The font supports kanji, kana, mandarin and many other languages (see full list in config file). All pixel art is by me. All icons are made by me and/or updated from my previous themes. (minimal_RTC_sync and bunnyPod).
# Code based on: minimal_RTC_sync and bunnyPod which were based on SNARTY by Simon Anden and BONES by Chuck Largo!

# YuGothic supported languages include Belarusian, Bulgarian, Catalan, Czech, Danish, German, Greek, English, Spanish, Finnish, Filipino, French, Croatian, Hungarian, Indonesian, Italian, Japanese, Macedonian, Malay, Maltese, Dutch, Norwegian, Polish, Portuguese, Russian, Slovak, Slovenlan, Serbian, Swedish, Turkish, Chinese Pinyin. 

#--CFG File--

wps: /.rockbox/wps/entune_audio_ext_font.wps
sbs: /.rockbox/wps/entune_audio_ext_font.sbs
selector type: bar (inverse)
font: /.rockbox/fonts/16-YuGothB.fnt
background color: 1B2134
foreground color: ffffff
statusbar: off
scrollbar: off
show icons: off
filetype colours: -